<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="#6366F1" opacity="0.1"/>
  
  <!-- Main Icon - Abstract representation of MCP Tools -->
  <path d="M30 40 L50 25 L70 40 L70 60 L50 75 L30 60 Z" 
        fill="none" 
        stroke="#6366F1" 
        stroke-width="3" 
        stroke-linejoin="round"/>
  
  <!-- Inner Lines -->
  <line x1="50" y1="25" x2="50" y2="50" stroke="#6366F1" stroke-width="2"/>
  <line x1="30" y1="40" x2="50" y2="50" stroke="#6366F1" stroke-width="2"/>
  <line x1="70" y1="40" x2="50" y2="50" stroke="#6366F1" stroke-width="2"/>
  
  <!-- Central Node -->
  <circle cx="50" cy="50" r="5" fill="#6366F1"/>
  
  <!-- Corner Nodes -->
  <circle cx="50" cy="25" r="3" fill="#6366F1"/>
  <circle cx="30" cy="40" r="3" fill="#6366F1"/>
  <circle cx="70" cy="40" r="3" fill="#6366F1"/>
  <circle cx="30" cy="60" r="3" fill="#6366F1"/>
  <circle cx="70" cy="60" r="3" fill="#6366F1"/>
  <circle cx="50" cy="75" r="3" fill="#6366F1"/>
</svg>

